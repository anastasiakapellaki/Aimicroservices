services:

  provider:
    build:
      context: .
      dockerfile: Dockerfile.provider
    container_name: invoice-provider
    ports:
      - "8000:8000"     # REST API → http://localhost:8000/docs

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: invoice-consumer
    ports:
      - "8001:8001"     # REST API → http://localhost:8001/docs
    environment:
      - PROVIDER_URL=http://invoice-provider:8000
    depends_on:
      - provider
